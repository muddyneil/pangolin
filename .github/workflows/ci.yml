name: CI

on:
  push:
    paths-ignore:
      - '*.md'
      - 'config.yaml'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'config.yaml'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags='-s -w' -o dist/pangolin-linux-amd64 ./cmd/pangolin
      - uses: actions/upload-artifact@v7
        with:
          name: pangolin-linux-amd64
          path: dist/pangolin-linux-amd64
          if-no-files-found: error