name: Deploy subscription

on:
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: 'Mihomo release tag to use (default: latest)'
        required: false
        default: 'latest'
  # Runs every two hours at the :13 mark (00:13, 02:13, ... 22:13 UTC),
  # skipping the top of the hour when GitHub servers are busiest.
  schedule:
    - cron: '13 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Mihomo version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_VERSION_INPUT: ${{ inputs.mihomo_version }}
        run: |
          tag="$MIHOMO_VERSION_INPUT"
          # Scheduled runs provide no inputs, so an empty value means latest.
          if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
            tag="$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Cache Mihomo core
        id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mihomo
          key: mihomo-${{ steps.version.outputs.tag }}
      - name: Download official Mihomo core
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MIHOMO_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_json="$(gh api "repos/MetaCubeX/mihomo/releases/tags/$MIHOMO_TAG")"
          asset_json="$(jq -c '[.assets[] | select(.name | test("^mihomo-linux-amd64-compatible.*\\.gz$"))][0]' <<< "$release_json")"
          if [ "$asset_json" = "null" ]; then
            # Standard v1 main build (mihomo-linux-amd64-v1.<tag>.gz). A broad
            # "-v1.*" pattern would match the go120/go123 toolchain variants
            # first, which are not the intended fallback.
            asset_json="$(jq -c '[.assets[] | select(.name | test("^mihomo-linux-amd64-v1\\.[0-9].*\\.gz$"))][0]' <<< "$release_json")"
          fi
          asset_url="$(jq -r '.browser_download_url // empty' <<< "$asset_json")"
          asset_digest="$(jq -r '.digest // empty' <<< "$asset_json")"
          test -n "$asset_url"
          if [ -z "$asset_digest" ]; then
            echo "ERROR: release $MIHOMO_TAG asset has no GitHub SHA-256 digest"
            exit 1
          fi
          [[ "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p tools/mihomo
          curl --fail --location --retry 3 "$asset_url" --output tools/mihomo/mihomo.gz
          if [ -n "$asset_digest" ]; then
            expected_sha256="${asset_digest#sha256:}"
            printf '%s  %s\n' "$expected_sha256" tools/mihomo/mihomo.gz | sha256sum --check --status
          fi
          gzip --decompress tools/mihomo/mihomo.gz
          chmod +x tools/mihomo/mihomo
      - name: Smoke-test Mihomo core
        run: tools/mihomo/mihomo -v
      - name: Generate subscription
        run: go run ./cmd/pangolin
      - name: Prepare Pages artifact
        run: |
          mkdir public
          cp clash.yaml public/clash.yaml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
